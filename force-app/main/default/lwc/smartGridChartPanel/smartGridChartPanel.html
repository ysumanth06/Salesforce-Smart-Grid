<template>
  <template lwc:if={isOpen}>
    <div
      class="chart-panel-container"
      data-testid="chart-panel-container"
      role="region"
      aria-label="Smart Grid Analytics Panel"
    >
      <!-- Header with Switcher & Close -->
      <div
        class="chart-header slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
      >
        <div class="slds-grid slds-grid_vertical-align-center">
          <lightning-icon
            icon-name="utility:chart"
            size="small"
            class="chart-icon slds-m-right_x-small"
          ></lightning-icon>
          <div>
            <h2 class="chart-title">Analytics Panel</h2>
            <p class="chart-subtitle">{objectSubtitle}</p>
          </div>
        </div>

        <div class="slds-grid slds-grid_vertical-align-center">
          <!-- Chart Type Switcher -->
          <lightning-button-group class="slds-m-right_small">
            <lightning-button
              label="Donut"
              variant={donutVariant}
              onclick={handleSelectDonut}
              title="Donut Chart"
            ></lightning-button>
            <lightning-button
              label="Bar"
              variant={barVariant}
              onclick={handleSelectBar}
              title="Bar Chart"
            ></lightning-button>
            <lightning-button
              label="Funnel"
              variant={funnelVariant}
              onclick={handleSelectFunnel}
              title="Funnel Chart"
            ></lightning-button>
          </lightning-button-group>

          <lightning-button-icon
            icon-name="utility:close"
            variant="border-filled"
            alternative-text="Close Analytics Panel"
            title="Close Analytics Panel"
            onclick={handleClose}
            data-testid="chart-close-btn"
          ></lightning-button-icon>
        </div>
      </div>

      <!-- Controls & KPI Row -->
      <div
        class="chart-top-bar slds-grid slds-grid_vertical-align-center slds-wrap slds-p-around_small"
      >
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-p-right_medium"
        >
          <div class="slds-grid slds-grid_vertical-align-center">
            <span
              class="slds-text-body_small slds-m-right_x-small slds-text-color_weak font-bold"
              >Group By:</span
            >
            <div class="slds-grow">
              <lightning-combobox
                name="groupBy"
                value={currentGroupByField}
                options={groupByOptions}
                onchange={handleGroupByChange}
                variant="label-hidden"
                class="chart-combobox"
              ></lightning-combobox>
            </div>
          </div>
        </div>

        <div class="slds-col slds-size_1-of-1 slds-medium-size_8-of-12">
          <div class="chart-kpi-row">
            <div class="chart-kpi-card">
              <div class="chart-kpi-val">{totalRecordCount}</div>
              <div class="chart-kpi-label">Records</div>
            </div>
            <div class="chart-kpi-card">
              <div class="chart-kpi-val">{formattedTotalSum}</div>
              <div class="chart-kpi-label">{volumeKpiLabel}</div>
            </div>
            <div class="chart-kpi-card">
              <div class="chart-kpi-val">{groupCount}</div>
              <div class="chart-kpi-label">Groups</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Body: Two Column Layout (Chart on Left/Center, Breakdown Legend on Right) -->
      <div class="chart-main-body slds-grid slds-wrap">
        <!-- Visual Canvas -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 chart-visual-col"
        >
          <!-- Donut Chart View -->
          <template lwc:if={isDonut}>
            <div class="chart-svg-container">
              <svg viewBox="0 0 200 200" width="220" height="220">
                <template for:each={donutSlices} for:item="slice">
                  <path
                    key={slice.label}
                    d={slice.pathData}
                    fill={slice.color}
                    stroke="#ffffff"
                    stroke-width="2"
                  >
                    <title>
                      {slice.label}: {slice.formattedValue}
                      ({slice.percentage}%)
                    </title>
                  </path>
                </template>
                <circle cx="100" cy="100" r="45" fill="#ffffff" />
                <text
                  x="100"
                  y="96"
                  text-anchor="middle"
                  font-size="12"
                  fill="#706e6b"
                >
                  Total
                </text>
                <text
                  x="100"
                  y="114"
                  text-anchor="middle"
                  font-size="14"
                  font-weight="bold"
                  fill="#080707"
                >
                  {donutCenterText}
                </text>
              </svg>
            </div>
          </template>

          <!-- Horizontal Bar Chart View -->
          <template lwc:if={isBar}>
            <div class="chart-bar-container">
              <template for:each={chartData} for:item="item">
                <div key={item.label} class="hbar-item">
                  <div class="hbar-header">
                    <span class="slds-truncate font-medium" title={item.label}
                      >{item.label}</span
                    >
                    <span class="slds-text-color_weak"
                      >{item.formattedValue} ({item.percentage}%)</span
                    >
                  </div>
                  <div class="hbar-track">
                    <div class="hbar-fill" style={item.barFillStyle}></div>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Funnel Chart View -->
          <template lwc:if={isFunnel}>
            <div class="chart-svg-container">
              <svg viewBox="0 0 280 200" width="280" height="200">
                <template for:each={funnelTrapezoids} for:item="trap">
                  <g key={trap.label}>
                    <polygon
                      points={trap.points}
                      fill={trap.color}
                      stroke="#ffffff"
                      stroke-width="1.5"
                    >
                      <title>
                        {trap.label}: {trap.formattedValue} ({trap.percentage}%)
                      </title>
                    </polygon>
                    <text
                      x="140"
                      y={trap.textY}
                      text-anchor="middle"
                      font-size="10"
                      font-weight="600"
                      fill="#ffffff"
                      style="pointer-events: none"
                    >
                      {trap.label}: {trap.formattedValue}
                    </text>
                  </g>
                </template>
              </svg>
            </div>
          </template>
        </div>

        <!-- Breakdown Legend Column -->
        <div
          class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12 chart-legend-col"
        >
          <div
            class="legend-header slds-m-bottom_x-small slds-grid slds-grid_align-spread"
          >
            <span class="slds-text-title_bold"
              >Breakdown by {currentGroupByField}</span
            >
            <span class="slds-text-body_small slds-text-color_weak"
              >{groupCount} categories</span
            >
          </div>
          <div class="legend-list-scroll">
            <template for:each={chartData} for:item="item">
              <div key={item.label} class="legend-item">
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-truncate"
                >
                  <span class="legend-color-dot" style={item.dotStyle}></span>
                  <span class="slds-truncate font-medium" title={item.label}
                    >{item.label}</span
                  >
                </div>
                <div
                  class="slds-text-body_small slds-text-color_weak slds-text-align_right"
                >
                  <strong>{item.count}</strong> recs ({item.percentage}%)
                  <span
                    class="slds-m-left_x-small slds-badge slds-badge_lightest"
                    >{item.formattedValue}</span
                  >
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>
  </template>
</template>
