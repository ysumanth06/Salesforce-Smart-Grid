<template>
  <template lwc:if={hasFilters}>
    <div
      class="slds-var-p-horizontal_small slds-var-p-vertical_xx-small filter-bar-container slds-grid slds-grid_vertical-align-center"
      data-testid="filter-bar"
    >
      <div
        class="slds-var-m-right_x-small slds-grid slds-grid_vertical-align-center filter-bar-label"
      >
        <lightning-icon
          icon-name="utility:filterList"
          size="x-small"
          class="slds-var-m-right_xx-small"
        ></lightning-icon>
        <span class="slds-text-title_bold slds-text-color_weak"
          >Active Filters:</span
        >
      </div>

      <div class="filter-pills-wrap slds-col slds-grid slds-wrap">
        <ul
          class="slds-listbox slds-listbox_horizontal"
          role="listbox"
          aria-label="Active filters"
        >
          <template for:each={filterPills} for:item="pill">
            <li key={pill.id} class="slds-listbox-item" role="presentation">
              <span
                class="slds-pill filter-pill"
                role="option"
                tabindex="0"
                title={pill.displayLabel}
              >
                <span class="slds-pill__label filter-pill-text">
                  {pill.displayLabel}
                </span>
                <button
                  type="button"
                  class="slds-button slds-button_icon slds-pill__remove"
                  title={pill.removeTitle}
                  aria-label={pill.removeTitle}
                  data-id={pill.id}
                  data-source={pill.source}
                  data-field={pill.fieldName}
                  data-value={pill.value}
                  onclick={handleRemovePill}
                >
                  <lightning-icon
                    icon-name="utility:close"
                    size="xx-small"
                    alternative-text={pill.removeTitle}
                  ></lightning-icon>
                  <span class="slds-assistive-text">{pill.removeTitle}</span>
                </button>
              </span>
            </li>
          </template>
        </ul>
      </div>

      <div class="slds-no-flex slds-var-m-left_x-small">
        <lightning-button
          variant="base"
          label="Clear All"
          icon-name="utility:clear"
          class="clear-all-button"
          onclick={handleClearAll}
        ></lightning-button>
      </div>
    </div>
  </template>
</template>
