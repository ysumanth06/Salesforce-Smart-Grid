<template>
  <div class="transpose-container">
    <!-- Action & Navigation Toolbar -->
    <div class="transpose-toolbar">
      <div class="transpose-toolbar-left">
        <lightning-button
          data-action="exit-transpose"
          label="Exit Transpose View"
          icon-name="utility:back"
          variant="neutral"
          onclick={handleClose}
        ></lightning-button>

        <!-- View Filter Mode Buttons -->
        <lightning-button-group class="slds-m-left_x-small">
          <lightning-button
            label={allFieldsButtonLabel}
            variant={allFilterVariant}
            onclick={handleFilterAll}
          ></lightning-button>
          <lightning-button
            label={diffFieldsButtonLabel}
            variant={diffFilterVariant}
            onclick={handleFilterDiff}
          ></lightning-button>
          <lightning-button
            label="Populated Only"
            variant={populatedFilterVariant}
            onclick={handleFilterPopulated}
          ></lightning-button>
        </lightning-button-group>
      </div>

      <div class="transpose-toolbar-right">
        <span
          class="slds-text-body_small slds-text-color_weak slds-m-right_small"
        >
          {summaryText}
        </span>

        <!-- Save / Cancel Toolbar Actions if Drafts Exist -->
        <template lwc:if={hasDraftValues}>
          <div
            class="slds-m-right_small slds-grid slds-grid_vertical-align-center"
          >
            <span class="slds-badge slds-theme_warning slds-m-right_x-small">
              {draftCountBadgeLabel}
            </span>
            <lightning-button
              label="Cancel"
              variant="neutral"
              onclick={handleCancel}
              class="slds-m-right_xx-small"
              data-testid="transpose-cancel-btn"
            ></lightning-button>
            <lightning-button
              label="Save"
              variant="brand"
              onclick={handleSave}
              data-testid="transpose-save-btn"
            ></lightning-button>
          </div>
        </template>

        <lightning-button-icon
          icon-name="utility:chevronleft"
          alternative-text="Scroll Left"
          title="Scroll Left"
          variant="border-filled"
          onclick={handleScrollLeft}
          data-testid="transpose-scroll-left"
        ></lightning-button-icon>
        <lightning-button-icon
          icon-name="utility:chevronright"
          alternative-text="Scroll Right"
          title="Scroll Right"
          variant="border-filled"
          onclick={handleScrollRight}
          data-testid="transpose-scroll-right"
        ></lightning-button-icon>
      </div>
    </div>

    <!-- Admin Safety Ceiling Banner -->
    <template lwc:if={isOverLimit}>
      <div class="transpose-limit-banner">
        <lightning-icon
          icon-name="utility:warning"
          size="x-small"
          class="slds-m-right_x-small"
        ></lightning-icon>
        <span>
          Viewing first {effectiveRecordCount} of {records.length} records
          (Admin safety limit: {maxTransposeLimit}).
        </span>
      </div>
    </template>

    <!-- Transposed Grid Scroll Workspace -->
    <div class="transpose-scroll-area">
      <table
        class="transpose-table slds-table slds-table_bordered"
        role="grid"
        aria-label="Transposed Grid"
      >
        <thead>
          <tr class="slds-line-height_reset">
            <!-- Pinned Field Column Header -->
            <th class="pinned-field-col slds-text-title_caps" scope="col">
              <span class="slds-truncate">Field Name</span>
            </th>

            <!-- Record Columns Headers -->
            <template for:each={recordColumns} for:item="col">
              <th
                key={col.recordId}
                class="transpose-record-header slds-text-title_caps"
                scope="col"
                style={recordColumnStyle}
                title={col.label}
              >
                <div class="slds-truncate">{col.label}</div>
              </th>
            </template>

            <!-- Discrepancy Status Header -->
            <th class="status-col slds-text-title_caps" scope="col">
              <span class="slds-truncate">Status</span>
            </th>
          </tr>
        </thead>

        <tbody>
          <template for:each={transposedRows} for:item="row">
            <tr key={row.id} class={row.rowClass}>
              <!-- Sticky Field Label Cell -->
              <td class="pinned-field-cell" scope="row">
                <div class="slds-grid slds-grid_vertical">
                  <span
                    class="slds-truncate slds-text-body_regular"
                    title={row.fieldLabel}
                  >
                    {row.fieldLabel}
                  </span>
                  <span
                    class="slds-text-body_small slds-text-color_weak slds-truncate"
                    title={row.fieldApiName}
                  >
                    {row.fieldApiName}
                  </span>
                </div>
              </td>

              <!-- Record Cells -->
              <template for:each={row.cells} for:item="cell">
                <td
                  key={cell.key}
                  class={cell.cellClass}
                  style={recordColumnStyle}
                  data-record-id={cell.recordId}
                  data-field={cell.fieldName}
                  ondblclick={handleCellDblClick}
                >
                  <template lwc:if={cell.isEditing}>
                    <input
                      type={cell.inputType}
                      class="slds-input cell-inline-input"
                      value={cell.displayValue}
                      data-record-id={cell.recordId}
                      data-field={cell.fieldName}
                      onblur={handleCellEditBlur}
                      onkeydown={handleCellEditKeyDown}
                    />
                  </template>
                  <template lwc:else>
                    <div
                      class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-has-flexi-truncate cell-wrapper"
                    >
                      <span
                        class="slds-truncate cell-value"
                        title={cell.displayValue}
                      >
                        {cell.displayValue}
                      </span>
                      <div
                        class="slds-grid slds-grid_vertical-align-center slds-no-flex"
                      >
                        <template lwc:if={cell.isDraft}>
                          <span class="dirty-dot" title="Unsaved change"
                            >•</span
                          >
                        </template>
                        <template lwc:if={cell.isEditable}>
                          <button
                            class="slds-button slds-button_icon cell-edit-btn"
                            title="Edit this field (or double-click cell)"
                            onclick={handleEditIconClick}
                            data-record-id={cell.recordId}
                            data-field={cell.fieldName}
                          >
                            <lightning-icon
                              icon-name="utility:edit"
                              size="xx-small"
                              class="cell-edit-icon"
                            ></lightning-icon>
                            <span class="slds-assistive-text">Edit</span>
                          </button>
                        </template>
                      </div>
                    </div>
                  </template>
                </td>
              </template>

              <!-- Discrepancy Status Badge -->
              <td class="status-cell">
                <span class={row.badgeClass}>{row.badgeLabel}</span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Sticky Bottom Save / Cancel Bar for Transpose Mode -->
    <template lwc:if={hasDraftValues}>
      <div
        class="transpose-footer-dock slds-grid slds-grid_align-center slds-grid_vertical-align-center"
      >
        <span class="slds-m-right_medium slds-text-body_regular font-semibold">
          You have unsaved changes ({draftCount})
        </span>
        <lightning-button
          label="Cancel"
          variant="neutral"
          onclick={handleCancel}
          class="slds-m-right_x-small"
          data-testid="transpose-dock-cancel-btn"
        ></lightning-button>
        <lightning-button
          label="Save Changes"
          variant="brand"
          onclick={handleSave}
          data-testid="transpose-dock-save-btn"
        ></lightning-button>
      </div>
    </template>
  </div>
</template>
