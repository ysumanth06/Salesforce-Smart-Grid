<template>
    <lightning-card title="Smart Data Grid">
        <!-- Filter Bar -->
        <template lwc:if={hasFilter}>
            <div class="slds-p-horizontal_medium slds-p-top_small">
                <lightning-combobox
                    name="gridFilter"
                    label={filterLabel}
                    value={selectedFilterValue}
                    options={filterOptions}
                    onchange={handleFilterChange}
                    variant="label-inline"
                ></lightning-combobox>
            </div>
        </template>

        <div class="slds-m-around_medium" style="height: 400px; position: relative;">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-p-bottom_small">{errorMessage}</div>
            </template>
            <template lwc:if={gridColumns}>
                <lightning-datatable
                    key-field="Id"
                    data={gridData}
                    columns={gridColumns}
                    onsave={handleSave}
                    draft-values={draftValues}>
                </lightning-datatable>
            </template>
            <template lwc:if={showNoConfigMessage}>
                <div class="slds-text-align_center slds-text-color_weak slds-p-around_large">
                    No grid configuration found. Please check your setup or provide a valid Grid Config Developer Name.
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Field Picker Modal (child) -->
    <c-smart-grid-field-picker
        object-api-name={objectApiName}
        selected-fields={pickerSelectedFields}
        onfieldselection={handleFieldSelection}
        onpickerclosed={handlePickerClosed}
    ></c-smart-grid-field-picker>
</template>
