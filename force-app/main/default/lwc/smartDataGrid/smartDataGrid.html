<template>
  <lightning-card title={gridTitle}>
    <div slot="actions">
      <template lwc:if={isDynamicGrid}>
        <lightning-button
          label="Select Fields"
          icon-name="utility:setup"
          onclick={openFieldPicker}
        ></lightning-button>
      </template>
      <lightning-button
        label="Add Row"
        icon-name="utility:add"
        onclick={handleAddRow}
        class="slds-m-left_x-small"
      ></lightning-button>
      <lightning-button
        label="Delete Selected"
        icon-name="utility:delete"
        variant="destructive"
        onclick={handleDelete}
        class="slds-m-left_x-small"
      ></lightning-button>
      <lightning-button
        label="Export CSV"
        icon-name="utility:download"
        onclick={handleExportCSV}
        class="slds-m-left_x-small"
      ></lightning-button>
      <lightning-button-icon
        icon-name="utility:filterList"
        alternative-text="Toggle Filters"
        title="Toggle Filters"
        onclick={toggleFilterPanel}
        class="slds-m-left_x-small"
        variant="border-filled"
      ></lightning-button-icon>
    </div>
    <!-- Active Filter Pills -->
    <template lwc:if={hasActiveFilters}>
      <div class="slds-p-horizontal_medium slds-m-bottom_small">
        <template for:each={activeFilterPills} for:item="pill">
          <lightning-pill
            key={pill.name}
            label={pill.label}
            name={pill.name}
            onremove={handleRemoveFilterPill}
            class="slds-m-right_xx-small"
          ></lightning-pill>
        </template>
      </div>
    </template>

    <!-- Filter Bar (Collapsible Panel) -->
    <template lwc:if={showFilterPanel}>
      <div
        class="slds-box slds-theme_shade slds-m-bottom_medium slds-m-horizontal_medium slds-p-around_medium"
      >
        <div
          class="slds-grid slds-wrap slds-gutters slds-grid_vertical-align-end"
        >
          <template for:each={filterFields} for:item="f">
            <div
              key={f.fieldName}
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small"
            >
              <template lwc:if={f.isPicklist}>
                <lightning-combobox
                  name={f.fieldName}
                  label={f.label}
                  value={f.selectedValue}
                  options={f.options}
                  onchange={handleFilterChange}
                ></lightning-combobox>
              </template>
              <template lwc:elseif={f.isDate}>
                <lightning-input
                  type="date"
                  name={f.fieldName}
                  label={f.label}
                  value={f.selectedValue}
                  onchange={handleFilterChange}
                ></lightning-input>
              </template>
              <template lwc:else>
                <lightning-input
                  type="text"
                  name={f.fieldName}
                  label={f.label}
                  value={f.selectedValue}
                  onchange={handleFilterChange}
                  placeholder="Search..."
                ></lightning-input>
              </template>
            </div>
          </template>

          <div
            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small slds-grid slds-grid_vertical-align-end"
          >
            <lightning-button
              label="Apply Filters"
              variant="brand"
              onclick={applyFilters}
              class="slds-m-right_x-small"
            ></lightning-button>
            <lightning-button
              label="Clear All"
              onclick={handleClearAllFilters}
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <div class="slds-m-around_medium" style="height: 400px; position: relative">
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
        ></lightning-spinner>
      </template>
      <template lwc:elseif={isSetupRequired}>
        <div
          class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center"
        >
          <div class="slds-text-longform slds-m-bottom_medium">
            <h3 class="slds-text-heading_medium">
              Grid Configuration Required
            </h3>
            <p class="slds-text-body_regular">
              Select the fields you want to display to get started.
            </p>
          </div>
          <lightning-button
            variant="brand"
            label="Select Fields to Display"
            onclick={openFieldPicker}
          ></lightning-button>
        </div>
      </template>
      <template lwc:elseif={errorMessage}>
        <div class="slds-text-color_error slds-p-bottom_small">
          {errorMessage}
        </div>
      </template>
      <template lwc:elseif={gridColumns}>
        <lightning-datatable
          key-field="Id"
          data={gridData}
          columns={gridColumns}
          onsave={handleSave}
          draft-values={draftValues}
          sorted-by={sortField}
          sorted-direction={sortDirection}
          onsort={handleSort}
          onresize={handleResize}
        >
        </lightning-datatable>
      </template>
      <template lwc:if={showNoConfigMessage}>
        <div
          class="slds-text-align_center slds-text-color_weak slds-p-around_large"
        >
          No grid configuration found. Please check your setup or provide a
          valid Grid Config Developer Name.
        </div>
      </template>
    </div>

    <!-- Pagination Footer -->
    <template lwc:if={gridColumns}>
      <div
        class="slds-grid slds-grid_align-center slds-p-top_small slds-p-bottom_medium slds-border_top"
      >
        <lightning-button
          label="Previous"
          icon-name="utility:chevronleft"
          onclick={handlePreviousPage}
          disabled={disablePrevious}
          variant="neutral"
          class="slds-m-right_medium"
        ></lightning-button>
        <span class="slds-align-middle slds-text-body_regular">
          Page <strong>{currentPage}</strong> of
          <strong>{totalPages}</strong> ({totalRecords} records)
        </span>
        <lightning-button
          label="Next"
          icon-name="utility:chevronright"
          icon-position="right"
          onclick={handleNextPage}
          disabled={disableNext}
          variant="neutral"
          class="slds-m-left_medium"
        ></lightning-button>
      </div>
    </template>
  </lightning-card>

  <!-- Field Picker Modal (child) -->
  <c-smart-grid-field-picker
    object-api-name={objectApiName}
    selected-fields={pickerSelectedFields}
    onfieldselection={handleFieldSelection}
    onpickerclosed={handlePickerClosed}
  ></c-smart-grid-field-picker>

  <!-- Resolution Modal (child) -->
  <c-smart-grid-resolution-modal
    object-api-name={objectApiName}
    columns={gridColumns}
    onrecordsolved={handleRecordSolved}
    oncomplete={handleResolutionComplete}
    onclose={handleResolutionClose}
  ></c-smart-grid-resolution-modal>
</template>
