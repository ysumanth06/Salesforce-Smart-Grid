<template>
    <lightning-card title={gridTitle}>
        <div slot="actions">
            <lightning-button label="Add Row" icon-name="utility:add" onclick={handleAddRow}></lightning-button>
            <lightning-button label="Delete Selected" icon-name="utility:delete" variant="destructive" onclick={handleDelete} class="slds-m-left_x-small"></lightning-button>
            <lightning-button label="Export CSV" icon-name="utility:download" onclick={handleExportCSV} class="slds-m-left_x-small"></lightning-button>
            <lightning-button label="Reset Config" icon-name="utility:refresh" onclick={handleResetPrefs} class="slds-m-left_x-small"></lightning-button>
        </div>
        <!-- Filter Bar -->
        <template lwc:if={hasFilters}>
            <div class="slds-grid slds-wrap slds-gutters slds-p-horizontal_medium slds-p-top_small slds-m-bottom_medium slds-grid_vertical-align-end">
                <template for:each={filterComboboxes} for:item="fc">
                    <div key={fc.fieldApiName} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <lightning-combobox
                            name={fc.fieldApiName}
                            label={fc.label}
                            value={fc.selectedValue}
                            options={fc.options}
                            onchange={handleMultiFilterChange}
                        ></lightning-combobox>
                    </div>
                </template>
                
                <template lwc:if={hasDateFilter}>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="date"
                            name="startDate"
                            label="Start Date"
                            value={dateFilter.startDate}
                            onchange={handleDateChange}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small">
                        <lightning-input
                            type="date"
                            name="endDate"
                            label="End Date"
                            value={dateFilter.endDate}
                            onchange={handleDateChange}
                        ></lightning-input>
                    </div>
                </template>
                
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-bottom_small">
                    <lightning-button label="Apply Filters" variant="brand" onclick={applyFilters}></lightning-button>
                </div>
            </div>
        </template>

        <div class="slds-m-around_medium" style="height: 400px; position: relative;">
            <template lwc:if={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-p-bottom_small">{errorMessage}</div>
            </template>
            <template lwc:if={gridColumns}>
                <lightning-datatable
                    key-field="Id"
                    data={gridData}
                    columns={gridColumns}
                    onsave={handleSave}
                    draft-values={draftValues}
                    sorted-by={sortField}
                    sorted-direction={sortDirection}
                    onsort={handleSort}
                    onresize={handleResize}>
                </lightning-datatable>
            </template>
            <template lwc:if={showNoConfigMessage}>
                <div class="slds-text-align_center slds-text-color_weak slds-p-around_large">
                    No grid configuration found. Please check your setup or provide a valid Grid Config Developer Name.
                </div>
            </template>
        </div>
    </lightning-card>

    <!-- Field Picker Modal (child) -->
    <c-smart-grid-field-picker
        object-api-name={objectApiName}
        selected-fields={pickerSelectedFields}
        onfieldselection={handleFieldSelection}
        onpickerclosed={handlePickerClosed}
    ></c-smart-grid-field-picker>

    <!-- Resolution Modal (child) -->
    <c-smart-grid-resolution-modal
        object-api-name={objectApiName}
        columns={gridColumns}
        onrecordsolved={handleRecordSolved}
        oncomplete={handleResolutionComplete}
        onclose={handleResolutionClose}
    ></c-smart-grid-resolution-modal>
</template>
