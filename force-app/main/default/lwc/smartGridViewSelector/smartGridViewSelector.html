<template>
  <div
    class="view-selector-container slds-grid slds-grid_vertical-align-center"
  >
    <div class="slds-m-right_x-small">
      <lightning-combobox
        name="viewSelector"
        label="View"
        value={selectedViewId}
        options={viewOptions}
        onchange={handleViewChange}
        variant="label-hidden"
        placeholder="Select View..."
        class="view-combobox"
      >
      </lightning-combobox>
    </div>

    <lightning-button-icon
      icon-name="utility:save"
      alternative-text="Save Current View"
      title="Save Current View"
      onclick={handleOpenSaveModal}
      variant="border-filled"
      class="slds-m-right_xx-small"
    >
    </lightning-button-icon>

    <template lwc:if={selectedViewId}>
      <lightning-button-icon
        icon-name="utility:delete"
        alternative-text="Delete Saved View"
        title="Delete Selected View"
        onclick={handleDeleteSelectedView}
        variant="border-filled"
      >
      </lightning-button-icon>
    </template>
  </div>

  <!-- Save View Modal Dialog -->
  <template lwc:if={showSaveModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      class="slds-modal slds-fade-in-open slds-modal_small"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleCloseSaveModal}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="inverse"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
            Save Current Grid View
          </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <lightning-input
            type="text"
            label="View Name"
            placeholder="e.g. High Value Opportunities"
            value={newViewName}
            onchange={handleNameChange}
            required
            class="slds-m-bottom_medium"
          >
          </lightning-input>

          <lightning-input
            type="checkbox"
            label="Set as default view for this object"
            checked={newViewIsDefault}
            onchange={handleDefaultChange}
          >
          </lightning-input>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            label="Cancel"
            onclick={handleCloseSaveModal}
            class="slds-m-right_x-small"
          ></lightning-button>
          <lightning-button
            label="Save View"
            onclick={handleSaveView}
            variant="brand"
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
