<!-- sldsValidatorIgnore -->
<template>
  <div
    class="view-selector-container slds-grid slds-grid_vertical-align-center"
  >
    <!-- Modified Badge (TS-02) -->
    <template lwc:if={isModified}>
      <span
        class="slds-badge slds-theme_warning slds-var-m-right_xx-small modified-badge"
        title="View has unsaved modifications"
        data-testid="modified-badge"
      >
        * Modified
      </span>
    </template>

    <div class="slds-var-m-right_x-small">
      <lightning-combobox
        name="viewSelector"
        label="View"
        value={selectedViewId}
        options={viewOptions}
        onchange={handleViewChange}
        variant="label-hidden"
        placeholder="Select View..."
        class="view-combobox"
      >
      </lightning-combobox>
    </div>

    <!-- View Action Menu (TS-02) -->
    <lightning-button-menu
      alternative-text="View Management Actions"
      title="View Options"
      menu-alignment="right"
      variant="border-filled"
      class="slds-var-m-right_xx-small"
      data-testid="view-menu"
    >
      <lightning-menu-item
        value="update"
        label="Update Current View"
        prefix-icon-name="utility:save"
        disabled={isUpdateDisabled}
        onclick={handleUpdateCurrentView}
        data-testid="menu-update"
      ></lightning-menu-item>
      <lightning-menu-item
        value="saveas"
        label="Save as New View..."
        prefix-icon-name="utility:new"
        onclick={handleOpenSaveModal}
        data-testid="menu-saveas"
      ></lightning-menu-item>
      <lightning-menu-item
        value="revert"
        label="Revert Changes"
        prefix-icon-name="utility:undo"
        disabled={isRevertDisabled}
        onclick={handleRevertChanges}
        data-testid="menu-revert"
      ></lightning-menu-item>
      <template lwc:if={canDelete}>
        <lightning-menu-divider></lightning-menu-divider>
        <lightning-menu-item
          value="delete"
          label="Delete View"
          prefix-icon-name="utility:delete"
          onclick={handleDeleteSelectedView}
          data-testid="menu-delete"
        ></lightning-menu-item>
      </template>
    </lightning-button-menu>

    <!-- Quick Save / Update Button -->
    <lightning-button-icon
      icon-name="utility:save"
      alternative-text={saveButtonTitle}
      title={saveButtonTitle}
      onclick={handleQuickSave}
      variant={saveButtonVariant}
      disabled={isQuickSaveDisabled}
      class="slds-var-m-right_xx-small"
      data-testid="quick-save-btn"
    >
    </lightning-button-icon>

    <template lwc:if={selectedViewId}>
      <lightning-button-icon
        icon-name="utility:delete"
        alternative-text="Delete Saved View"
        title="Delete Selected View"
        onclick={handleDeleteSelectedView}
        variant="border-filled"
      >
      </lightning-button-icon>
    </template>
  </div>

  <!-- Save View Modal Dialog -->
  <template lwc:if={showSaveModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      class="slds-modal slds-fade-in-open slds-modal_small"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            aria-label="Close"
            onclick={handleCloseSaveModal}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="Close"
              variant="inverse"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
            Save as New View
          </h2>
        </header>

        <div class="slds-modal__content slds-var-p-around_medium">
          <lightning-input
            type="text"
            label="View Name"
            placeholder="e.g. High Value Opportunities"
            value={newViewName}
            onchange={handleNameChange}
            required
            class="slds-var-m-bottom_medium"
          >
          </lightning-input>

          <lightning-input
            type="checkbox"
            label="Set as default view for this object"
            checked={newViewIsDefault}
            onchange={handleDefaultChange}
          >
          </lightning-input>
        </div>

        <footer class="slds-modal__footer">
          <lightning-button
            label="Cancel"
            onclick={handleCloseSaveModal}
            class="slds-var-m-right_x-small"
          ></lightning-button>
          <lightning-button
            label="Save View"
            onclick={handleSaveView}
            variant="brand"
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
