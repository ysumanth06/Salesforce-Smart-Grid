<template>
  <template lwc:if={isOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-label="Fix Record Errors"
      class="slds-modal slds-fade-in-open slds-modal_small"
    >
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={handleClose}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2 class="slds-text-heading_medium slds-hyphenate">
            Fix Record Errors ({currentIdx} of {totalCount})
          </h2>
        </header>

        <div class="slds-modal__content slds-p-around_medium">
          <template lwc:if={currentRecord}>
            <lightning-record-edit-form
              object-api-name={objectApiName}
              onsuccess={handleSuccess}
              onerror={handleError}
            >
              <lightning-messages></lightning-messages>
              <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={fieldsToRender} for:item="f">
                  <div
                    key={f.fieldName}
                    class="slds-col slds-size_1-of-2 slds-p-bottom_small"
                  >
                    <lightning-input-field
                      field-name={f.fieldName}
                      value={f.value}
                    ></lightning-input-field>
                  </div>
                </template>
              </div>
              <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                  label="Skip"
                  onclick={handleSkip}
                  class="slds-m-right_small"
                ></lightning-button>
                <lightning-button
                  variant="brand"
                  type="submit"
                  label="Save Record"
                ></lightning-button>
              </div>
            </lightning-record-edit-form>
          </template>
        </div>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
</template>
